name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test, lint and build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Lint
        id: lint
        run: ./gradlew --stacktrace lintDebug

      - name: Lint report
        if: ${{ !cancelled() && steps.lint.outcome != 'skipped' }}
        run: cat app/build/reports/lint-results.txt

      - name: Build APKs
        run: ./gradlew --stacktrace assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: lumen-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
